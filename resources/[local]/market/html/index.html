<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market UI</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="hidden">
      <div class="window">
        <div class="header">
          <div class="title">Market</div>
          <button id="close" class="icon">✕</button>
        </div>
        <div class="shop-meta">
          <div id="shopLabel">Shop</div>
          <div class="search">
            <button id="searchBtn" class="search-btn" aria-label="Ara">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23C15.99 6.01 12.98 3 9.5 3S3 6.01 3 9.5 6.01 16 9.5 16a6.5 6.5 0 0 0 4.23-1.57l.27.28v.79l5 5 1.5-1.5-5-5ZM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
            </button>
            <input id="search" type="text" placeholder="Ara..." autocomplete="off" />
          </div>
        </div>
        <div id="items" class="items"></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
